<header class="masthead">
  <h1 class="brand">Polish</h1>
  <p class="tagline">Revisão de currículo e LinkedIn com IA</p>
</header>

<main class="workspace">
  <app-review-form
    [busy]="store.busy()"
    (submitted)="onSubmitted($event)"
    (cleared)="onReset()"
    (cancelled)="onReset()"
  />
  <app-review-panel />
</main>
